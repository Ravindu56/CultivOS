name: CI — AI Crop Service (Python)

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'services/ai-crop-service/**'
      - '.github/workflows/ci-python-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/ai-crop-service/**'
      - '.github/workflows/ci-python-service.yml'

env:
  IMAGE_NAME: ghcr.io/ravindu56/cultivos/ai-crop-service

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-crop-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/ai-crop-service/requirements.txt
            services/ai-crop-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "::notice::No tests/ directory yet — skipping pytest."
          fi

  docker:
    name: Build & push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: hashFiles('services/ai-crop-service/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: services/ai-crop-service
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
