# CultivOS — Local Development Infrastructure
# Epic #21 baseline: Kafka 4.3 KRaft (no Zookeeper), WSO2 IS 7.1.0, RustFS (S3), OpenTelemetry
#
# Profiles:
#   core  - postgres, redis, kafka, kafka-ui, rustfs
#   auth  - wso2is (combine with core)
#   full  - everything, including otel-collector
#
# Usage:
#   docker compose -f docker-compose.dev.yml --profile core up -d
#   docker compose -f docker-compose.dev.yml --profile core --profile auth up -d
#   docker compose -f docker-compose.dev.yml --profile full up -d
# Reset: docker compose -f docker-compose.dev.yml --profile full down -v
#
# Object storage credentials can be overridden with RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY.

name: cultivos-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: cultivos-postgres
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: cultivos
      POSTGRES_PASSWORD: cultivos_dev
      POSTGRES_DB: cultivos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultivos -d cultivos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cultivos-redis
    profiles: ["core", "full"]
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: cultivos-kafka
    profiles: ["core", "full"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTVFOTdGNDcyQQ
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    # Kafbat is the maintained fork of provectuslabs/kafka-ui (paused since 2023)
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: cultivos-kafka-ui
    profiles: ["core", "full"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cultivos-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"

  # S3-compatible object storage. Replaces MinIO, which no longer publishes official images.
  rustfs-perms:
    image: alpine:3.20
    container_name: cultivos-rustfs-perms
    profiles: ["core", "full"]
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - rustfsdata:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: cultivos-rustfs
    profiles: ["core", "full"]
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cultivos}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cultivos_dev}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  wso2is:
    image: wso2/wso2is:7.1.0
    container_name: cultivos-wso2is
    profiles: ["auth", "full"]
    ports:
      - "9443:9443"   # Console + OIDC endpoints (admin/admin — change for shared envs)
    volumes:
      - isdata:/home/wso2carbon/wso2is-7.1.0/repository/deployment/server
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost:9443/api/health-check/v1.0/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: cultivos-otel-collector
    profiles: ["full"]
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scrape target)

volumes:
  pgdata:
  redisdata:
  kafkadata:
  rustfsdata:
  isdata:
