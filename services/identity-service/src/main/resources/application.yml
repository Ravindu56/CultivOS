server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cultivos_identity
    username: ${DB_USERNAME:cultivos}
    password: ${DB_PASSWORD:cultivos_dev}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema - Hibernate never alters it
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
