# identity-service — base configuration (local dev defaults)
# Issue #13 · Epic #3 — all secrets via env vars; defaults are local-dev only.

server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cultivos_identity}
    username: ${DB_USERNAME:cultivos}
    password: ${DB_PASSWORD:cultivos_dev}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema — Hibernate never alters it
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

# JWT — RS256 keypair (#11). PEM files live under keys/ locally and are never
# committed (keys/.gitignore). Generate dev keys:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
#   openssl rsa -in keys/private.pem -pubout -out keys/public.pem
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:file:./keys/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./keys/public.pem}
  access-token-ttl: PT15M      # 15 minutes
  refresh-token-ttl: P7D       # 7 days

# Actuator — liveness/readiness probes used by Docker healthcheck (#15) and K8s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
