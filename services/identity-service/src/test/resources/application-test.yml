# Test profile — activated via @ActiveProfiles("test")
# Testcontainers JDBC URL boots a throwaway postgis/postgis:17-3.5 container
# (requires testcontainers test deps — wired in with #18 integration tests).

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:tc:postgis:17-3.5:///cultivos_identity}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration   # tests validate real migrations, never H2 approximations

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP:localhost:9092}

logging:
  level:
    org.springframework.security: DEBUG
